name: Deploy Courtly to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtly-production-deploy
  cancel-in-progress: false

jobs:
  test-build-deploy:
    # Forks: change this to your repository to enable production deploys.
    if: github.repository == 'aritejhg/courtly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COURTLY_FEED_KV_NAMESPACE_ID: ${{ vars.COURTLY_FEED_KV_NAMESPACE_ID }}
      COURTLY_REQUIRE_FEED_BINDING: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify venue mappings
        run: npm run venues:verify

      - name: Build production app
        env:
          # Secrets, not vars: Actions masks them in logs, which are public on a public repo.
          VITE_COURTLY_TELEGRAM_SOURCE_URL: ${{ secrets.COURTLY_TELEGRAM_SOURCE_URL }}
          VITE_COURTLY_TELEGRAM_CHAT_ID: ${{ secrets.COURTLY_TELEGRAM_CHAT_ID }}
          VITE_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.VITE_CLOUDFLARE_ANALYTICS_TOKEN }}
        run: npm run build

      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run publish:cloudflare

      - name: Verify protected production edge
        shell: bash
        env:
          # Repository variable holding the Worker's URL. The check is skipped if unset.
          PRODUCTION_URL: ${{ vars.COURTLY_PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::COURTLY_PRODUCTION_URL is not set; skipping the production edge check."
            exit 0
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PRODUCTION_URL")"
          test "$status" = "401"
