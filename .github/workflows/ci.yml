name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build with synthetic Telegram values
        env:
          VITE_COURTLY_TELEGRAM_SOURCE_URL: https://t.me/+ci-synthetic-invite-marker
          VITE_COURTLY_TELEGRAM_CHAT_ID: '-1009876543210123'
          COURTLY_TELEGRAM_SOURCE_URL: https://t.me/+ci-synthetic-invite-marker
          COURTLY_TELEGRAM_CHAT_ID: '-1009876543210123'
        run: npm run build

      - name: Check Telegram values stay out of the build
        env:
          COURTLY_MARKER_SOURCE_URL: ci-synthetic-invite-marker
          COURTLY_MARKER_CHAT_ID: '9876543210123'
        run: node scripts/check-client-bundle.mjs
