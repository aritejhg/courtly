# Example systemd drop-in with generic paths. Copy it and change the repository and
# script path for your host. The script also reads COURTLY_GITHUB_SOURCE_DIR,
# COURTLY_APP_DIR, COURTLY_GITHUB_KEY, and COURTLY_GITHUB_KNOWN_HOSTS; add Environment=
# lines to override their defaults. See docs/operations.md.
[Service]
Environment=COURTLY_GITHUB_REPOSITORY=aritejhg/courtly
ExecStartPre=/usr/bin/bash /opt/courtly/source/scripts/deploy-from-github-oracle.sh
